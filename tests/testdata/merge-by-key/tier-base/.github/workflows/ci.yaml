name: CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check coverage threshold
        if: hashFiles('coverage.out') != ''
        run: coverage verify --threshold 70
      - name: Base only
        run: echo base

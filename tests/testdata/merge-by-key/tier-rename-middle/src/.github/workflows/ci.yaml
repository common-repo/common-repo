name: CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check coverage threshold
        if: hashFiles('coverage.out', 'coverprofile.out') != ''
        run: coverage verify --threshold 80
      - name: Middle only
        run: echo middle

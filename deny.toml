# Configuration for cargo-deny
# See https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true

[advisories]
version = 2
# Ignore unmaintained/unsound crates in transitive dependencies we don't control
# These come from: ptree, config, indicatif, serde_yaml dependency chains
ignore = [
    "RUSTSEC-2021-0139",  # ansi_term - unmaintained (via ptree)
    "RUSTSEC-2024-0375",  # atty - unsound (via ptree)
    "RUSTSEC-2021-0145",  # atty - unmaintained (via ptree)
    "RUSTSEC-2025-0119",  # number_prefix - unmaintained (via indicatif)
    "RUSTSEC-2024-0370",  # proc-macro-error - unmaintained (via ptree->derivative)
    "RUSTSEC-2024-0320",  # yaml-rust - unmaintained (via ptree->config)
    "RUSTSEC-2023-0086",  # lexical-core - unsound (via ptree->config->nom)
    "RUSTSEC-2024-0449",  # unsafe-libyaml - unmaintained (via serde_yaml; parser replacement tracked separately)
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "AGPL-3.0-or-later",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
